<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Taskey">
  <!-- The app's own mark: the indigo squircle from the sidebar, with a
       single bold check. The lucide glyph it is drawn from has a square
       around the tick, which turns to mud at 16px, so the squircle itself
       plays that part. -->
  <rect width="64" height="64" rx="15" fill="#4f57d2"/>
  <path d="M17.5 33.5 27 43 46.5 21.5" fill="none" stroke="#ffffff"
        stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
